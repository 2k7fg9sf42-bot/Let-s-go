<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Sou</title>
<meta name="description" content="Tes dépenses, en deux gestes.">
<meta name="theme-color" content="#F3F0E8" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#100F0D" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Sou">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icon-180.png">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="../fonts/fonts.css">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app">

  <!-- ============ SAISIR ============ -->
  <section class="view view-add is-active" id="view-add" aria-label="Saisir une dépense">
    <header class="top">
      <div class="wordmark">Sou<span class="dot">.</span></div>
      <button class="glance" id="glance" type="button" aria-label="Voir le mois">
        <span class="glance-label" id="glance-label">reste —</span>
        <span class="glance-bar"><i id="glance-fill"></i></span>
      </button>
    </header>

    <div class="amount-zone">
      <div class="amount" id="amount" aria-live="polite"><span class="amount-num" id="amount-num">0</span><span class="amount-cur" id="amount-cur">€</span></div>
      <div class="meta-row">
        <button type="button" class="meta-btn" id="when-btn"><svg viewBox="0 0 16 16"><rect x="2" y="3" width="12" height="11" rx="2"/><path d="M2 6.5h12M5.5 1.5v3M10.5 1.5v3"/></svg><span id="when-label">Aujourd'hui</span></button>
        <button type="button" class="meta-btn" id="note-btn"><svg viewBox="0 0 16 16"><path d="M3 13l1-3.5L10.5 3a1.4 1.4 0 012 2L6 11.5z"/></svg><span id="note-label">Note</span></button>
      </div>
    </div>

    <div class="cats" id="cats" role="group" aria-label="Catégorie — touche pour enregistrer"></div>

    <div class="pad" id="pad">
      <button type="button" data-k="1">1</button><button type="button" data-k="2">2</button><button type="button" data-k="3">3</button>
      <button type="button" data-k="4">4</button><button type="button" data-k="5">5</button><button type="button" data-k="6">6</button>
      <button type="button" data-k="7">7</button><button type="button" data-k="8">8</button><button type="button" data-k="9">9</button>
      <button type="button" data-k="," class="k-soft">,</button><button type="button" data-k="0">0</button>
      <button type="button" data-k="del" class="k-soft" aria-label="Effacer (appui long : tout effacer)"><svg viewBox="0 0 24 24"><path d="M9 5h10a2 2 0 012 2v10a2 2 0 01-2 2H9l-6-7z"/><path d="M12 9.5l5 5M17 9.5l-5 5"/></svg></button>
    </div>
  </section>

  <!-- ============ MOIS ============ -->
  <section class="view view-month" id="view-month" aria-label="Le mois">
    <header class="top top-month">
      <button type="button" class="icon-btn" id="m-prev" aria-label="Mois précédent"><svg viewBox="0 0 16 16"><path d="M10 3L5 8l5 5"/></svg></button>
      <div class="m-title" id="m-title">—</div>
      <button type="button" class="icon-btn" id="m-next" aria-label="Mois suivant"><svg viewBox="0 0 16 16"><path d="M6 3l5 5-5 5"/></svg></button>
      <button type="button" class="icon-btn settings-btn" id="settings-btn" aria-label="Réglages"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="2.6"/><path d="M10 1.8v2.4M10 15.8v2.4M1.8 10h2.4M15.8 10h2.4M4.2 4.2l1.7 1.7M14.1 14.1l1.7 1.7M4.2 15.8l1.7-1.7M14.1 5.9l1.7-1.7"/></svg></button>
    </header>

    <div class="scroll" id="month-scroll">
      <div class="hero">
        <div class="hero-label">Dépensé</div>
        <div class="hero-num" id="h-spent">0 €</div>
        <div class="hero-sub" id="h-sub">—</div>
        <div class="gauge" id="gauge"><div class="gauge-track" id="gauge-track"></div><div class="gauge-pace" id="gauge-pace"><span>rythme idéal</span></div></div>
      </div>

      <div class="stats" id="stats"></div>

      <div class="block">
        <div class="block-head"><h2>Jour par jour</h2><span class="block-hint" id="chart-hint"></span></div>
        <div class="chart" id="chart"></div>
      </div>

      <div class="block">
        <div class="block-head"><h2>Par catégorie</h2></div>
        <div class="catlist" id="catlist"></div>
      </div>

      <div class="block">
        <div class="block-head"><h2>Toutes les dépenses</h2><span class="block-hint" id="tx-count"></span></div>
        <div class="txlist" id="txlist"></div>
      </div>
      <div class="foot-space"></div>
    </div>
  </section>

  <!-- ============ TABS ============ -->
  <nav class="tabs" id="tabs">
    <button type="button" class="tab is-active" data-view="add"><svg viewBox="0 0 20 20"><path d="M10 4v12M4 10h12"/></svg><span>Saisir</span></button>
    <button type="button" class="tab" data-view="month"><svg viewBox="0 0 20 20"><path d="M3.5 16.5V11M8.5 16.5V5M13.5 16.5V9M18 16.5H2"/></svg><span>Mois</span></button>
  </nav>
</div>

<!-- ============ TOAST ============ -->
<div class="toast" id="toast" role="status"><span class="toast-dot" id="toast-dot"></span><span class="toast-text" id="toast-text"></span><button type="button" class="toast-undo" id="toast-undo">Annuler</button></div>

<!-- ============ SHEET ============ -->
<div class="scrim" id="scrim"></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="grip"></div><div class="sheet-body" id="sheet-body"></div></div>

<label id="hap" aria-hidden="true" style="display:none"><input type="checkbox" switch></label>
<script src="app.js"></script>
</body>
</html>
