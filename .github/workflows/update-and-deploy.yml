name: Mise à jour et publication

on:
  # Chaque lundi à 05h00 UTC (06h00 ou 07h00 à Paris)
  schedule:
    - cron: "0 5 * * 1"
  # Bouton « Run workflow » dans l'onglet Actions pour lancer une mise à jour à la main
  workflow_dispatch:
  # Republie le site à chaque modification de la branche principale
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  update:
    if: github.event_name != 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Récupérer les événements
        run: python3 scripts/update.py

      - name: Enregistrer les nouvelles données
        run: |
          if git diff --quiet -- data; then
            echo "Aucun changement."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          git commit -m "Mise à jour des événements MMA ($(date -u +%Y-%m-%d))"
          git push

  deploy:
    needs: update
    if: always() && (needs.update.result == 'success' || needs.update.result == 'skipped')
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - id: deployment
        uses: actions/deploy-pages@v4
